<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIYAZ BAJAR</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family: 'Hind Siliguri', sans-serif;}
  body{background:#0d0d1a;color:#fff;}
  .hidden{display:none !important;}
  
  /* Header */
  header{background:#111827;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;color:#8b5cf6;}
  .logo img{width:35px;height:35px;border-radius:50%;}
  .header-right{display:flex;gap:10px;align-items:center;}
  .balance{background:#22c55e;padding:8px 15px;border-radius:20px;font-weight:bold;font-size:14px;}
  
  /* Notice */
  .notice{background:#dc2626;padding:10px;display:flex;align-items:center;gap:10px;border-radius:8px;margin:10px;}
  
  /* Tabs */
  .tabs{display:flex;gap:10px;padding:0 10px;margin:15px 0;}
  .tab{flex:1;padding:10px;border-radius:25px;background:#1f2937;text-align:center;font-weight:600;cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,#8b5cf6,#3b82f6);}
  
  /* Products */
  .products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 10px 80px 10px;}
  .card{background:#1f2937;border-radius:12px;overflow:hidden;}
  .card img{width:100%;height:160px;object-fit:cover;}
  .card-body{padding:10px;text-align:center;}
  .card-title{font-size:14px;font-weight:600;margin-bottom:5px;}
  .price{color:#22c55e;font-size:16px;font-weight:700;margin-bottom:8px;}
  .btn-blue{background:linear-gradient(90deg,#3b82f6,#8b5cf6);color:#fff;border:none;padding:8px;border-radius:8px;width:100%;margin-bottom:6px;cursor:pointer;font-weight:600;}
  .btn-pink{background:#ec4899;color:#fff;border:none;padding:8px;border-radius:8px;width:100%;cursor:pointer;font-weight:600;}
  
  /* Bottom Nav */
  .bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#111827;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222;}
  .nav-item{text-align:center;font-size:11px;color:#aaa;cursor:pointer;}
  .nav-item.active{color:#8b5cf6;}
  
  /* Popup */
  .popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;justify-content:center;align-items:center;padding:15px;}
  .popup-box{background:#1f2937;padding:20px;border-radius:12px;width:100%;max-width:400px;}
  .popup-box h2{color:#22c55e;text-align:center;margin-bottom:10px;}
  .pay-number{background:#111827;padding:15px;border-radius:8px;text-align:center;margin:10px 0;}
  .pay-number b{font-size:22px;color:#22c55e;letter-spacing:1px;}
  .popup-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#111827;color:#fff;}
  .submit{background:#22c55e;color:#000;padding:12px;border:none;border-radius:8px;width:100%;font-weight:700;cursor:pointer;}
  
  /* Admin Panel */
  .admin-form{background:#1f2937;padding:20px;border-radius:12px;margin:10px;}
  .admin-form input, .admin-form textarea{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #333;background:#111827;color:#fff;}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo"><img src="https://i.pravatar.cc/100"> NIYAZ BAJAR</div>
  <div class="header-right">
    <div class="balance">0৳</div>
  </div>
</header>

<!-- MAIN CONTENT -->
<div id="userPanel">
  <div class="notice">● 24 ঘন্টা সার্ভিস খোলা আছে</div>

  <div class="tabs">
    <div class="tab active" onclick="filterTab('all')">ALL</div>
    <div class="tab" onclick="filterTab('non')">NON ROOT</div>
    <div class="tab" onclick="filterTab('vip')">VIP</div>
  </div>

  <div class="products" id="productList">
    <!-- Product 1 -->
    <div class="card" data-cat="non">
      <img src="https://via.placeholder.com/400x160/3b82f6/fff?text=PRODUCT+1" alt="">
      <div class="card-body">
        <div class="card-title">PREMIUM TOOL</div>
        <div class="price">PRICE 25৳</div>
        <button class="btn-blue" onclick="window.open('https://youtube.com', '_blank')">FILE & SETUP</button>
        <button class="btn-pink" onclick="openPopup('PREMIUM TOOL', '25')">BUY NOW</button>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="card" data-cat="vip">
      <img src="https://via.placeholder.com/400x160/ec4899/fff?text=PRODUCT+2" alt="">
      <div class="card-body">
        <div class="card-title">VIP ACCESS</div>
        <div class="price">PRICE 30৳</div>
        <button class="btn-blue" onclick="window.open('https://youtube.com', '_blank')">FILE & SETUP</button>
        <button class="btn-pink" onclick="openPopup('VIP ACCESS', '30')">BUY NOW</button>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN PANEL - Secret Page -->
<div id="adminPanel" class="hidden">
  <h2 style="text-align:center;color:#8b5cf6;margin:15px 0;">Admin Panel</h2>
  <div class="admin-form">
    <h3>নতুন প্রোডাক্ট অ্যাড করুন</h3>
    <input type="text" id="pName" placeholder="Product Name">
    <input type="number" id="pPrice" placeholder="Price">
    <input type="text" id="pImg" placeholder="Image Link">
    <input type="text" id="pVideo" placeholder="Youtube Setup Video Link">
    <button class="submit" onclick="addProduct()">Add Product</button>
  </div>
</div>

<!-- PAYMENT POPUP -->
<div class="popup" id="paymentPopup">
  <div class="popup-box">
    <h2>Payment করুন</h2>
    <p id="pNameText"></p>
    <p><b>Price: <span id="pPriceText"></span>৳</b></p>
    <div class="pay-number">
      <p>bKash / Nagad এ Send Money করুন</p>
      <b>01908807313</b>
    </div>
    <input type="text" id="trx" placeholder="Transaction ID দিন">
    <input type="text" id="num" placeholder="আপনার নাম্বার দিন">
    <button class="submit" onclick="submitOrder()">Submit Order</button>
    <button onclick="closePopup()" style="width:100%;margin-top:8px;padding:10px;background:#444;border:none;border-radius:8px;color:#fff;">Cancel</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showUser()">Home</div>
  <div class="nav-item">Add Fund</div>
  <div class="nav-item">My Order</div>
  <div class="nav-item">My Keys</div>
  <div class="nav-item" onclick="showAdmin()">Account</div>
</div>

<script>
// Admin Panel Password
let ADMIN_PASSWORD = "niyaZ123"; // এইটা চেঞ্জ করে দাও

function showAdmin(){
  let pass = prompt("Admin Password দিন:");
  if(pass == ADMIN_PASSWORD){
    document.getElementById('userPanel').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  } else {
    alert("Wrong Password!");
  }
}
function showUser(){
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('userPanel').classList.remove('hidden');
}

// Add Product Function
function addProduct(){
  let name = document.getElementById('pName').value;
  let price = document.getElementById('pPrice').value;
  let img = document.getElementById('pImg').value;
  let video = document.getElementById('pVideo').value;
  
  alert("Product Added: " + name + "\n" + price + "৳");
  // এখানে আসলে Database এ সেভ হবে। HTML এ Static থাকবে
}

// Payment Popup
function openPopup(name, price){
  document.getElementById('pNameText').innerText = 'Product: ' + name;
  document.getElementById('pPriceText').innerText = price;
  document.getElementById('paymentPopup').style.display = 'flex';
}
function closePopup(){ document.getElementById('paymentPopup').style.display = 'none'; }
function submitOrder(){
  let trx = document.getElementById('trx').value;
  if(trx == ''){ alert('Transaction ID দিন!'); return; }
  alert('Order Received! 5 মিনিটের মধ্যে প্রোডাক্ট দেওয়া হবে।');
  closePopup();
}
</script>

</body>
</html>
